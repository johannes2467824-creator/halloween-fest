<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#100b16"><title>Halloween Party | Check In</title>
<style>
*{box-sizing:border-box}:root{--bg:#100b16;--card:#21162b;--input:#35273d;--orange:#f47b20;--text:#fff5ec;--muted:#b6a5c3}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#45234d 0%,transparent 60%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.container{width:100%;max-width:420px}.header{text-align:center;margin-bottom:32px}.pumpkin{font-size:70px;margin-bottom:14px;animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
h1{margin:0;color:var(--orange);font-size:clamp(32px,9vw,43px);font-weight:900;letter-spacing:2px}.subtitle{color:var(--muted);font-size:12px;letter-spacing:3px;margin-top:10px}
.card{background:var(--card);border:1px solid #503451;border-radius:24px;padding:28px 23px;box-shadow:0 18px 60px #0005}h2{text-align:center;margin:0 0 10px;font-size:22px;letter-spacing:1px}.description{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.5}
label{display:block;margin:0 0 8px;color:#d6c4df;font-size:13px;font-weight:600}input{width:100%;border:1px solid #57435e;background:var(--input);color:white;border-radius:12px;padding:16px;margin-bottom:19px;font-size:16px;outline:none}input:focus{border-color:var(--orange)}input::placeholder{color:#97859e}
button{width:100%;padding:17px;border:0;border-radius:13px;background:var(--orange);color:#1b0e0c;font-size:16px;font-weight:900;letter-spacing:1px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:#45314c;color:white;margin-top:12px}.status{text-align:center;margin-top:16px;color:var(--muted);font-size:13px;line-height:1.5;min-height:18px}.success{text-align:center;display:none}.success-icon{font-size:65px;margin-bottom:14px}.success h2{color:var(--orange)}.success p{color:var(--muted);line-height:1.6}.footer{text-align:center;color:#88728e;font-size:12px;margin-top:26px}[hidden]{display:none!important}
</style></head><body><main class="container"><header class="header"><div class="pumpkin">🎃</div><h1>HALLOWEEN</h1><div class="subtitle">THE NIGHT BEGINS HERE</div></header><section class="card"><div id="checkinScreen"><h2>ENTER IF YOU DARE</h2><p class="description">Enter your name to join the party.</p><form id="checkinForm"><label for="firstName">First name</label><input id="firstName" maxlength="60" placeholder="Your first name" autocomplete="given-name" required><label for="lastName">Last name</label><input id="lastName" maxlength="60" placeholder="Your last name" autocomplete="family-name" required><button id="checkinButton" type="submit">CHECK IN →</button></form></div><div id="successScreen" class="success"><div class="success-icon">👻</div><h2>YOU'RE IN!</h2><p id="successMessage">Welcome to the party!</p><button id="checkoutButton" class="secondary">CHECK OUT</button></div><div class="status" id="status" role="status"></div></section><div class="footer">ONE NIGHT. NO ESCAPE. 🦇</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://vyoossjhezicpiaboarx.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_kPAvsMkdvMbmQt27uTnxgw_Ks2277pb";
const statusBox=document.getElementById('status');
const checkinScreen=document.getElementById('checkinScreen'),successScreen=document.getElementById('successScreen');
const checkinButton=document.getElementById('checkinButton'),checkoutButton=document.getElementById('checkoutButton');
const KEY='halloween_guest_token_v2';
let db;
try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){statusBox.textContent='Website not configured yet. Ask the host.'}
function message(s){statusBox.textContent=s}
function showIn(name){checkinScreen.hidden=true;successScreen.style.display='block';document.getElementById('successMessage').textContent=`Welcome to the party, ${name}! 🎃`;message('Keep this page open or return on this phone to check out.')}
function showOut(){localStorage.removeItem(KEY);checkinScreen.hidden=false;successScreen.style.display='none';document.getElementById('checkinForm').reset();message('Checked out! See you next time. 👻')}
async function restore(){if(!db)return;const token=localStorage.getItem(KEY);if(!token)return;try{const {data,error}=await db.rpc('party_guest_status',{p_token:token});if(error)throw error;if(data?.length&&!data[0].checked_out){showIn(data[0].first_name)}else{localStorage.removeItem(KEY)}}catch(e){message('Could not restore check-in. Try again later.')}}
document.getElementById('checkinForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;checkinButton.disabled=true;checkinButton.textContent='CHECKING IN...';message('');try{const {data,error}=await db.rpc('party_check_in',{p_first:document.getElementById('firstName').value.trim(),p_last:document.getElementById('lastName').value.trim()});if(error)throw error;if(!data?.[0]?.token)throw Error('No check-in token returned');localStorage.setItem(KEY,data[0].token);showIn(data[0].first_name)}catch(err){console.error(err);message('Check-in failed. Please ask the host for help.')}finally{checkinButton.disabled=false;checkinButton.textContent='CHECK IN →'}});
checkoutButton.addEventListener('click',async()=>{const token=localStorage.getItem(KEY);if(!db||!token)return;checkoutButton.disabled=true;checkoutButton.textContent='CHECKING OUT...';try{const {data,error}=await db.rpc('party_check_out',{p_token:token});if(error)throw error;if(!data)throw Error('Check-in already closed');showOut()}catch(err){console.error(err);message('Check-out failed. Ask the host to check you out.')}finally{checkoutButton.disabled=false;checkoutButton.textContent='CHECK OUT'}});
restore();
</script></body></html>
